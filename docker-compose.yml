services:
  vinyl-vault:
    build: .
    container_name: vinyl-vault
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    volumes:
      - vv-data:/app/data
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: vv-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - vv-prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    depends_on:
      - vinyl-vault
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: vv-grafana
    ports:
      - "3001:3000"
    environment:
      # Anonymous viewing on for the demo; change for anything non-local.
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_USERS_DEFAULT_THEME=dark
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - vv-grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  vv-data:
  vv-prometheus-data:
  vv-grafana-data:
