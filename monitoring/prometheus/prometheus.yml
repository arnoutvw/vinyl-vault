global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: "vinyl-vault"
    metrics_path: /metrics
    static_configs:
      - targets: ["vinyl-vault:3000"]
        labels:
          service: "vinyl-vault"

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
